# .github/workflows/deploy-hybrid.yml
name: Astro 단일화 실시간 대시보드 배포 파이프라인

on:
  push:
    branches:
      - main
  workflow_dispatch: # 수동 트리거 지원

jobs:
  build-and-deploy:
    name: Astro 빌드 및 Vercel 배포
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      # 2. Node.js 가상 환경 구성
      - name: Node.js 개발 환경 셋업
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.1'
          cache: 'npm'
          cache-dependency-path: './package.json'

      # 3. 의존성 패키지 설치
      - name: 의존성 설치
        run: npm install --prefer-offline --no-audit --no-fund

      # 4. Astro 정적 빌드 기동
      - name: Astro 정적 빌드
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL || vars.PUBLIC_SITE_URL }}
          PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # 5. Vercel CDN 배포 실행
      - name: Vercel 프로덕션 최종 배포
        run: |
          npx vercel deploy ./dist --token ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }} --prod --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
