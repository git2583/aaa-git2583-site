# .github/workflows/deploy-hybrid.yml
name: Astro + Next.js 하이브리드 배포 파이프라인

on:
  push:
    branches:
      - main
  workflow_dispatch: # 수동 트리거 지원

jobs:
  build-and-deploy:
    name: 하이브리드 빌드 및 Vercel 배포
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      # 2. Node.js 가상 환경 구성
      - name: Node.js 개발 환경 셋업
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.1'
          cache: 'npm'
          cache-dependency-path: './package.json'

      # 3. 의존성 패키지 설치
      - name: 의존성 설치
        run: npm install --prefer-offline --no-audit --no-fund

      # 4. Stage 1: Astro 정적 빌드 (SSG) 기동
      - name: Stage 1 - Astro 정적 빌드 (SSG)
        run: npm run build-astro
        env:
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}

      # 5. Stage 2: Next.js 동적 앱 빌드 (Static Export) 기동
      - name: Stage 2 - Next.js 빌드 (Telemetry 우회)
        run: NEXT_TELEMETRY_DISABLED=1 npm run build-next
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # 6. Stage 3: 하이브리드 빌드 아웃풋 병합 복사
      # Next.js의 out/ 폴더 자산을 Astro의 dist/dashboard/ 하위 경로로 이전하고 vercel.json도 복사하여 단일 통합 트리를 만듭니다.
      - name: Stage 3 - 빌드 아웃풋 병합 (Next.js -> Astro dist/dashboard)
        run: |
          mkdir -p ./dist/dashboard
          cp -r ./out/* ./dist/dashboard/
          cp ./vercel.json ./dist/
          echo "[성공] Next.js 정적 자산 및 vercel.json이 Astro 게이트웨이 하위 경로로 이식 완료되었습니다."

      # 7. Stage 4: Vercel CDN 단일 도메인 배포 실행
      - name: Stage 4 - Vercel 프로덕션 최종 배포
        run: |
          npx vercel deploy ./dist --token ${{ secrets.VERCEL_TOKEN }} --prod
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
